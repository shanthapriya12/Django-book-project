<!DOCTYPE html>
<html>

<head>
    <title>Delete Book</title>
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'books/style.css' %}">
</head>

<body>

<h1>Delete Book</h1>

<p>
    Are you sure you want to delete
    "{{ book.title }}"?
</p>

<form method="POST">

    {% csrf_token %}

    <button type="submit">
        Yes, Delete
    </button>

</form>

<br>

<a href="{% url 'books:book_detail' book.id %}">
    Cancel
</a>

</body>

</html>
